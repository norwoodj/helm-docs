dockers:
  - goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    skip_push: auto
    build_flag_templates:
      - --platform=linux/amd64
    image_templates:
      - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-amd64
  - goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    skip_push: auto
    build_flag_templates:
      - --platform=linux/arm64
    image_templates:
      - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-arm64
  - goos: linux
    goarch: arm
    goarm: 6
    dockerfile: Dockerfile
    use: buildx
    skip_push: auto
    build_flag_templates:
      - --platform=linux/arm/v6
    image_templates:
      - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-arm64v6
  - goos: linux
    goarch: arm
    goarm: 7
    dockerfile: Dockerfile
    use: buildx
    skip_push: auto
    build_flag_templates:
      - --platform=linux/arm/v7
    image_templates:
      - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-arm64v7
docker_manifests:
- name_template: ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}
  skip_push: auto
  image_templates:
    - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-amd64
    - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-arm64
    - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-arm64v6
    - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-arm64v7
- name_template: ghcr.io/robmyersrobmyers/{{ .ProjectName }}:latest
  skip_push: auto
  image_templates:
    - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-amd64
    - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-arm64
    - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-arm64v6
    - ghcr.io/robmyersrobmyers/{{ .ProjectName }}:{{ .Tag }}-arm64v7
