name: Test version fallback

on:
  push:
    branches:
      - fix/version-fallback-build-info

jobs:
  test-go-install:
    name: Test go install sets version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build via go install (no ldflags)
        run: go install ./cmd/helm-docs

      - name: Verify version is set
        run: |
          VERSION=$(helm-docs --version 2>&1)
          echo "helm-docs --version output: $VERSION"
          if echo "$VERSION" | grep -q "(devel)"; then
            echo "PASS: version is set to (devel) via debug.ReadBuildInfo"
          else
            echo "FAIL: version is empty or unexpected"
            exit 1
          fi

      - name: Verify footer is rendered
        run: |
          mkdir -p /tmp/test-chart
          cat > /tmp/test-chart/Chart.yaml <<'EOF'
          apiVersion: v2
          name: test-chart
          description: A test chart
          version: 0.1.0
          appVersion: "1.0.0"
          EOF
          cat > /tmp/test-chart/values.yaml <<'EOF'
          replicaCount: 1
          EOF
          helm-docs --chart-search-root=/tmp --dry-run 2>/dev/null | tee /tmp/readme-output.txt
          if grep -q "Autogenerated from chart metadata" /tmp/readme-output.txt; then
            echo "PASS: footer is rendered"
          else
            echo "FAIL: footer is missing"
            cat /tmp/readme-output.txt
            exit 1
          fi

  test-pre-commit:
    name: Test pre-commit helm-docs-built hook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Create test repo with pre-commit config
        run: |
          mkdir -p /tmp/test-repo/charts/test-chart
          cd /tmp/test-repo
          git init
          git config user.email "test@test.com"
          git config user.name "Test"

          # Chart files
          cat > charts/test-chart/Chart.yaml <<'EOF'
          apiVersion: v2
          name: test-chart
          description: A test chart
          version: 0.1.0
          appVersion: "1.0.0"
          EOF

          cat > charts/test-chart/values.yaml <<'EOF'
          replicaCount: 1
          EOF

          # Pre-commit config pointing at this branch
          cat > .pre-commit-config.yaml <<EOF
          repos:
          - repo: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
            rev: $GITHUB_SHA
            hooks:
            - id: helm-docs-built
              args:
              - --chart-search-root=charts
          EOF

          git add -A
          git commit -m "initial"

      - name: Run pre-commit (first run generates README)
        working-directory: /tmp/test-repo
        run: |
          pre-commit run helm-docs-built --all-files || true
          echo "--- Generated README ---"
          cat charts/test-chart/README.md

      - name: Verify footer in generated README
        working-directory: /tmp/test-repo
        run: |
          if grep -q "Autogenerated from chart metadata" charts/test-chart/README.md; then
            echo "PASS: pre-commit helm-docs-built produces footer"
          else
            echo "FAIL: footer is missing from pre-commit generated README"
            cat charts/test-chart/README.md
            exit 1
          fi

      - name: Commit and verify idempotence
        working-directory: /tmp/test-repo
        run: |
          git add -A
          git commit -m "add generated readme"
          pre-commit run helm-docs-built --all-files
          echo "PASS: pre-commit is idempotent (no changes on second run)"
